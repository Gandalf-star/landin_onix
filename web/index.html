<!DOCTYPE html>
<html lang="es-CL">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#030E36">

  <title>Reto 50 Onix · Invita y gana con Onix Drive</title>
  <meta name="description" content="Invita por WhatsApp con un código exclusivo por persona. Cada invitado verificado desde su propio celular suma un ticket: con 50 eliges una de tres cajas y te llevas su premio. Participar es gratis.">

  <!-- Vista previa al compartir el link (WhatsApp, Instagram, X) -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_CL">
  <meta property="og:site_name" content="Onix Drive">
  <meta property="og:title" content="Reto 50 Onix · Invita y gana">
  <meta property="og:description" content="Invita a 50 personas, abre tu caja y llévate un viaje gratis, un regalo Onix o saldo Onix. Gratis y sin trucos.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Reto 50 Onix · Invita y gana">
  <meta name="twitter:description" content="Invita a 50 personas, abre tu caja y llévate un premio de Onix Drive.">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Reto 50 Onix">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <!-- Tipografías de la landing: Manrope para títulos, Inter para texto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #07102C;
      overflow: hidden;
    }

    /* Pantalla de carga: evita el destello blanco antes de que arranque
       el motor de Flutter. La quita el propio Flutter al montar la app. */
    #carga-onix {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      background: linear-gradient(135deg, #07102C 0%, #030E36 55%, #061E6D 100%);
      font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif;
      transition: opacity .45s ease;
      z-index: 9999;
    }

    #carga-onix.oculto { opacity: 0; pointer-events: none; }

    #carga-onix .marca {
      color: #FFFFFF;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 6px;
    }

    #carga-onix .marca span { color: #FFC700; }

    #carga-onix .barra {
      width: 168px;
      height: 4px;
      border-radius: 99px;
      background: rgba(255, 255, 255, .14);
      overflow: hidden;
    }

    #carga-onix .barra i {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #FFCC00, #FFA000);
      animation: corre 1.15s ease-in-out infinite;
    }

    @keyframes corre {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(320%); }
    }
  </style>
</head>
<body>
  <div id="carga-onix">
    <div class="marca">ONIX<span>·</span>DRIVE</div>
    <div class="barra"><i></i></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var carga = document.getElementById('carga-onix');
      if (!carga) return;
      document.documentElement.style.overflow = 'auto';
      document.body.style.overflow = 'auto';
      carga.classList.add('oculto');
      setTimeout(function () { carga.remove(); }, 500);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
